# Builds the static encryptid demo (encryptid-offline/, `npm run build:pages`)
# and publishes it with GitHub Pages.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy encryptid demo to GitHub Pages

on:
  push:
    branches: [claude/focused-gauss-6r44pi]
    paths: ['encryptid-offline/**', '.github/workflows/encryptid-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never cancel a deployment halfway; let the newest queued one go next
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encryptid-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: encryptid-offline/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # base_path is the sub-path Pages serves the site from, e.g. /Personal
      - run: node scripts/pages.js build "${{ steps.pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: encryptid-offline/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
